services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - desk-pg:/var/lib/postgresql/data
  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./proxy.yaml:/app/config.yaml:ro
      - ./handler.py:/app/handler.py:ro
      - ./pricing.py:/app/pricing.py:ro
    depends_on:
      - db

volumes:
  desk-pg:
